### model
model_name_or_path: models/SpatialLM1.1-Llama-1B
trust_remote_code: true
use_fast_tokenizer: false

### method
do_train: true
freeze_language_tower: false
freeze_point_tower: true
train_proj_only: false

### dataset — Scheme A / J0: surface-only SpatialLM baseline
# Fair trio: J0 / J2-O (oracle sharp) / J2-P (detected sharp).
# Same split 2236/280/280, cutoff=4096, 20 epochs, lr=2e-5, effective batch=4.
# Surface encoder frozen (OOM on 44GB with 8192-pt geometry_pack + long Fusion DSL).
# LLM + surface projector trained. Fair vs J2-* (Sonata also frozen).
# input: geometry_pack_v1/surface_points.npy  [8192,6]
# target: geometry_pack_v1/cad_target.dsl  (same as J2-O / J2-P)
dataset: joint_j0j2_v1_train
eval_dataset: joint_j0j2_v1_val
dataset_dir: ../cad_spatial_dataset/joint_deepcad_fusion360_v1
media_dir: ../cad_spatial_dataset
template: spatiallm_cad_llama_baseline
num_bins: 1280
do_augmentation: false
random_rotation: false
cutoff_len: 4096
overwrite_cache: false
preprocessing_num_workers: 2
dataloader_num_workers: 2
save_dir: saves/joint_j0_surface_v1

### output
output_dir: saves/joint_j0_surface_v1
logging_steps: 10
save_steps: 500
overwrite_output_dir: false
save_total_limit: 3
report_to: none

### train
per_device_train_batch_size: 1
# With 2-GPU DDP keep effective batch = 4 (was 1×4 on 1 GPU).
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
num_train_epochs: 20
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
tf32: true
ddp_timeout: 180000000
max_new_tokens: 4096

gradient_checkpointing: true
disable_gradient_checkpointing: false

### eval
val_size: 0.0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
